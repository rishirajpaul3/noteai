app = 'noteai-backend'
primary_region = 'lhr'

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/notetaker.db"

[mounts]
  source = "noteai_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
